[workspace]
members = [
    "crates/weaveffi-model",
    "crates/weaveffi-abi",
    "crates/weaveffi-macros",
    "crates/weaveffi",
    "crates/weaveffi-gen",
    "crates/weaveffi-cli",
    "samples/calculator",
    "samples/contacts",
    "samples/async-demo",
    "samples/events",
    "samples/kvstore",
    "samples/codec",
    "crates/weaveffi-fuzz",
]
resolver = "2"

default-members = [
    "crates/weaveffi-cli",
]

[workspace.package]
version = "0.24.0"
rust-version = "1.85"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["WeaveFFI Contributors"]
repository = "https://github.com/weavefoundry/weaveffi"
description = "WeaveFFI: Rust core with stable C ABI and multi-language bindings"

[workspace.dependencies]
weaveffi = { path = "crates/weaveffi", version = "0.24.0" }
weaveffi-abi = { path = "crates/weaveffi-abi", version = "0.24.0" }
weaveffi-macros = { path = "crates/weaveffi-macros", version = "0.24.0" }
weaveffi-model = { path = "crates/weaveffi-model", version = "0.24.0", default-features = false }
weaveffi-gen = { path = "crates/weaveffi-gen", version = "0.24.0" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
camino = { version = "1.1", features = ["serde1"] }
sha2 = "0.10"
heck = "0.5"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
similar = "2.0"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
miette = { version = "7", features = ["fancy"] }
insta = { version = "1", features = ["yaml", "json"] }
schemars = { version = "0.8", features = ["preserve_order"] }
rayon = "1.10"

[workspace.lints.rust]
unsafe_code = "deny"
