# `weaveffi generate` (no arguments) from anywhere in this crate uses this.
[project]
input = "."
out = "bindings"

# The package name, prefix, and library come from Cargo.toml (`kvstore`);
# this table adds the published metadata.
[package]
version = "1.0.0"
description = "An embedded key-value store with listeners, write policies, read-through loaders, iteration, and async compaction."
license = "MIT"
authors = ["WeaveFoundry <hello@weavefoundry.dev>"]
homepage = "https://github.com/weavefoundry/weaveffi"
repository = "https://github.com/weavefoundry/weaveffi"

[generators.go]
name = "github.com/example/kvstore"
