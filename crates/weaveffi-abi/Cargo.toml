[package]
name = "weaveffi-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stable C ABI runtime types and helpers for WeaveFFI"
keywords = ["ffi", "abi", "c-abi", "bindings", "codegen"]
categories = ["development-tools::ffi"]

[features]
# Count live objects, callbacks, iterators, cancel tokens, and returned byte
# allocations so `{prefix}_debug_live` can report leaks. Off by default
# because every counted operation pays for an atomic update.
leak-check = []

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
