[package]
name = "weaveffi-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Code-generation orchestrator and the eleven language generators for WeaveFFI"
keywords = ["ffi", "codegen", "bindings", "code-generation", "generator"]
categories = ["development-tools::ffi"]

[dependencies]
weaveffi-model = { workspace = true, features = ["idl"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
heck = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "codegen_bench"
harness = false

[lints]
workspace = true
