[package]
name = "weaveffi-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "IR, parsers, Rust extractor, validation, and the resolved binding model for WeaveFFI API definitions"
keywords = ["ffi", "codegen", "bindings", "ir", "parser"]
categories = ["development-tools::ffi"]

[features]
default = ["idl"]
# The IDL text formats (YAML, JSON, TOML), JSON Schema derivation, and fancy
# miette diagnostics. The proc-macros build without it.
idl = ["dep:serde_yaml", "dep:serde_json", "dep:toml", "dep:schemars", "dep:miette"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
heck = { workspace = true }
syn = { workspace = true }
serde_yaml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
miette = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
