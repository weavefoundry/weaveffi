[package]
name = "weaveffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Write safe Rust, get a stable C ABI and bindings for 11 languages"
keywords = ["ffi", "abi", "bindings", "codegen", "proc-macro"]
categories = ["development-tools::ffi"]

[dependencies]
weaveffi-macros = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[features]
# Count live objects, callbacks, iterators, cancel tokens, and returned byte
# allocations so `{prefix}_debug_live` can report leaks. Off by default
# because every counted operation pays for an atomic update. Every sample
# enables it.
leak-check = []
# Run exported `async fn`s on Tokio: the current runtime when a launcher is
# called from inside one, otherwise a multi-thread runtime created on first
# use. `set_spawner` still overrides it.
tokio = ["dep:tokio"]

[dev-dependencies]
# The leak-counter test needs counting on. A path-only self dependency turns
# the feature on for this crate's tests, and `cargo publish` strips it.
weaveffi = { path = ".", features = ["leak-check"] }
proptest = "1.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[lints]
workspace = true
