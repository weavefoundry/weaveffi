[package]
name = "weaveffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Write safe Rust, get a stable C ABI and bindings for 11 languages"
keywords = ["ffi", "abi", "bindings", "codegen", "proc-macro"]
categories = ["development-tools::ffi"]

[dependencies]
weaveffi-abi = { workspace = true }
weaveffi-macros = { workspace = true }

[features]
# Count live objects, callbacks, iterators, cancel tokens, and returned
# allocations for `{prefix}_debug_live`. Every sample enables it.
leak-check = ["weaveffi-abi/leak-check"]

# Dev-dependencies are path-only (no version) so `cargo publish` strips them:
# a versioned dev-dependency must already be on crates.io when this crate is
# published, which would force `weaveffi-gen` to publish first.
[dev-dependencies]
# Only for the ABI-revision lockstep test; the facade never links the
# generators at runtime.
weaveffi-gen = { path = "../weaveffi-gen" }
# The leak-counter test needs counting on.
weaveffi-abi = { path = "../weaveffi-abi", features = ["leak-check"] }

[lints]
workspace = true
