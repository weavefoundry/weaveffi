[package]
name = "weaveffi-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Procedural macros that turn safe annotated Rust into WeaveFFI C ABI scaffolding"
keywords = ["ffi", "proc-macro", "codegen", "bindings", "weaveffi"]
categories = ["development-tools::ffi"]

[lib]
proc-macro = true

[dependencies]
weaveffi-model = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = "1.0"

[lints]
workspace = true

[dev-dependencies]
trybuild = "1.0.120"
weaveffi = { path = "../weaveffi" }
