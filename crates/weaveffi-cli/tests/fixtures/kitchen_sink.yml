version: "0.12.0"
modules:
  - name: shared
    structs:
      - name: Token
        doc: A reusable token referenced across modules
        fields:
          - { name: id, type: i64 }
          - { name: label, type: string }
    functions:
      - name: ping
        doc: Trivial cross-module helper
        params: []
        return: string
  - name: kitchen
    enums:
      - name: Priority
        doc: Task priority levels
        variants:
          - { name: Low, value: 0, doc: Low priority }
          - { name: Normal, value: 1, doc: Normal priority }
          - { name: High, value: 2, doc: High priority }
    structs:
      - name: Item
        doc: Kitchen sink struct exercising every field feature
        fields:
          - { name: id, type: i64, doc: Stable identifier }
          - { name: name, type: string, doc: Display name }
          - { name: count, type: i32, doc: Initial count }
          - { name: enabled, type: bool, doc: Whether the item is enabled }
          - { name: ratio, type: f64, doc: Scaling ratio }
          - { name: nick, type: u32 }
          - { name: payload, type: bytes }
          - { name: tags, type: "[string]" }
          - { name: attrs, type: "{string:string}" }
          - { name: parent, type: "i64?" }
          - { name: token, type: Token, doc: Cross-module struct reference }
          - { name: priority, type: Priority }
          - { name: gadget, type: "Gadget?", doc: An optional object inside a record }
    callback_interfaces:
      - name: ReadyListener
        doc: Consumer-implemented observer of ready items
        methods:
          - name: on_ready
            doc: Fires when an item is ready
            params:
              - { name: code, type: i32 }
              - { name: msg, type: string }
          - name: on_item
            doc: Receives the item itself and says whether to keep listening
            params:
              - { name: item, type: Item }
              - { name: gadget, type: Gadget }
            return: bool
          - name: label
            doc: A display label, failing with a kitchen error
            params: []
            return: string
            throws: KitchenErrors
          - name: latest
            doc: The most recent item the listener kept, if any
            params: []
            return: "Item?"
          - name: favorite
            doc: The listener's favorite gadget
            params: []
            return: Gadget
      - name: Sampler
        doc: Consumer-implemented source of scalar samples
        methods:
          - name: threshold
            doc: The cutoff for a level, if the sampler has one
            params:
              - { name: level, type: "u32?" }
            return: "f64?"
          - name: samples
            doc: Up to `limit` samples, failing when the pantry is empty
            params:
              - { name: limit, type: "u32?" }
              - { name: weights, type: "[f64]" }
            return: "[i16]"
            throws: PantryError
          - name: describe
            doc: A free-form description, failing with an untyped error
            params: []
            return: string
            throws: any
    errors:
      - name: KitchenErrors
        codes:
          - { name: NotFound, code: 1, message: "Item not found" }
          - { name: InvalidInput, code: 2, message: "Invalid input" }
      - name: PantryError
        codes:
          - { name: OutOfStock, code: 1, message: "Out of stock", fields: [{ name: item, type: string }] }
          - { name: Spoiled, code: 2, message: "Spoiled" }
    interfaces:
      - name: Gadget
        doc: A pocket-sized interface exercising the object surface
        constructors:
          - name: new
            doc: Create a gadget with the given id
            params:
              - { name: id, type: i64 }
        methods:
          - name: describe
            doc: Render the gadget as a human-readable string
            params: []
            return: string
          - name: poke
            doc: Poke the gadget a number of times, failing on a negative count
            params:
              - { name: times, type: i32 }
            return: i32
            throws: KitchenErrors
          - name: readings
            doc: The gadget's sensor readings, optionally limited
            params:
              - { name: limit, type: "u32?" }
            return: "[f64]"
            throws: any
        statics:
          - name: version
            doc: The gadget subsystem version string
            params: []
            return: string
    functions:
      - name: bool_id
        doc: Identity for bool
        params:
          - { name: x, type: bool }
        return: bool
      - name: i32_id
        params:
          - { name: x, type: i32 }
        return: i32
      - name: u32_id
        params:
          - { name: x, type: u32 }
        return: u32
      - name: i64_id
        params:
          - { name: x, type: i64 }
        return: i64
      - name: f64_id
        params:
          - { name: x, type: f64 }
        return: f64
      - name: echo_string
        params:
          - { name: s, type: string }
        return: string
      - name: echo_bytes
        params:
          - { name: b, type: bytes }
        return: bytes
      - name: subscribe
        doc: Register a listener, returning how many are attached
        params:
          - { name: listener, type: ReadyListener }
        return: i32
      - name: maybe_subscribe
        doc: Register a listener if one is given
        params:
          - { name: listener, type: "ReadyListener?" }
        return: bool
      - name: maybe_gadget
        doc: Optional object in both directions
        params:
          - { name: fallback, type: "Gadget?" }
        return: "Gadget?"
      - name: gadgets
        doc: A list of objects
        params: []
        return: "[Gadget]"
      - name: stream_gadgets
        doc: An iterator over objects
        params: []
        return: "iter<Gadget>"
      - name: maybe_item
        doc: Optional struct return
        params:
          - { name: id, type: i64 }
        return: "Item?"
        throws: KitchenErrors
      - name: list_items
        doc: List of structs
        params: []
        return: "[Item]"
      - name: get_attrs
        doc: Map return type
        params: []
        return: "{string:i32}"
      - name: stream_items
        doc: Iterator return type
        params: []
        return: "iter<Item>"
      - name: cross_module_token
        doc: Returns the shared Token type from another module
        params: []
        return: Token
      - name: do_async
        doc: Async operation
        params:
          - { name: input, type: string }
        return: string
        async: true
      - name: do_cancellable
        doc: Cancellable async operation
        params:
          - { name: input, type: string }
        return: string
        async: true
        cancellable: true
      - name: legacy_op
        doc: Legacy operation kept for compatibility
        params: []
        return: i32
        deprecated: "Use `new_op` instead"
      - name: new_op
        doc: Replacement for `legacy_op`
        params: []
        return: i32
      - name: opt_i32_id
        doc: Optional scalar in both directions
        params:
          - { name: x, type: "i32?" }
        return: "i32?"
      - name: opt_bool_id
        params:
          - { name: x, type: "bool?" }
        return: "bool?"
      - name: opt_priority
        doc: Optional C-style enum in both directions
        params:
          - { name: p, type: "Priority?" }
        return: "Priority?"
      - name: opt_mixed
        doc: Optional scalars next to ordinary parameters
        params:
          - { name: base, type: f64 }
          - { name: scale, type: "f32?" }
          - { name: offset, type: "i64?" }
          - { name: label, type: "string?" }
        return: "u16?"
      - name: sum_f64
        doc: A typed-array parameter
        params:
          - { name: xs, type: "[f64]" }
        return: f64
      - name: scale_i32
        doc: Typed arrays in both directions
        params:
          - { name: xs, type: "[i32]" }
          - { name: factor, type: i32 }
        return: "[i32]"
      - name: ids_u64
        params:
          - { name: ids, type: "[u64]" }
        return: "[u64]"
      - name: mixed_slices
        doc: Every slice element type
        params:
          - { name: a, type: "[i8]" }
          - { name: b, type: "[i16]" }
          - { name: c, type: "[u16]" }
          - { name: d, type: "[u32]" }
          - { name: e, type: "[i64]" }
          - { name: f, type: "[f32]" }
        return: "[u32]"
      - name: async_maybe_count
        doc: Async returning an optional scalar
        params: []
        return: "i64?"
        async: true
      - name: async_samples
        doc: Async returning a typed array
        params:
          - { name: n, type: u32 }
        return: "[f32]"
        async: true
        cancellable: true
      - name: stream_maybe
        doc: Iterator of optional scalars
        params: []
        return: "iter<i32?>"
      - name: stream_chunks
        doc: Iterator of typed arrays
        params: []
        return: "iter<[i32]>"
      - name: sample_with
        doc: Drive a consumer-implemented sampler
        params:
          - { name: sampler, type: Sampler }
          - { name: level, type: "u32?" }
        return: "[i16]"
        throws: PantryError
      - name: take_from_pantry
        doc: Fails with the second domain
        params:
          - { name: item, type: string }
        return: i32
        throws: PantryError
      - name: parse_any
        doc: Fails with an untyped error
        params:
          - { name: text, type: string }
        return: i64
        throws: any
    modules:
      - name: nested
        functions:
          - name: hello
            doc: Trivial nested-module function
            params: []
            return: string
