version: "0.9.0"
modules:
  - name: shared
    structs:
      - name: Token
        doc: A reusable token referenced across modules
        fields:
          - { name: id, type: i64 }
          - { name: label, type: string }
    functions:
      - name: ping
        doc: Trivial cross-module helper
        params: []
        return: string
  - name: kitchen
    enums:
      - name: Priority
        doc: Task priority levels
        variants:
          - { name: Low, value: 0, doc: Low priority }
          - { name: Normal, value: 1, doc: Normal priority }
          - { name: High, value: 2, doc: High priority }
    structs:
      - name: Item
        doc: Kitchen sink struct exercising every field feature
        fields:
          - { name: id, type: i64, doc: Stable identifier }
          - { name: name, type: string, doc: Display name }
          - { name: count, type: i32, doc: Initial count }
          - { name: enabled, type: bool, doc: Whether the item is enabled }
          - { name: ratio, type: f64, doc: Scaling ratio }
          - { name: nick, type: u32 }
          - { name: payload, type: bytes }
          - { name: tags, type: "[string]" }
          - { name: attrs, type: "{string:string}" }
          - { name: parent, type: "i64?" }
          - { name: token, type: Token, doc: Cross-module struct reference }
          - { name: priority, type: Priority }
          - { name: gadget, type: "Gadget?", doc: An optional object inside a record }
    callback_interfaces:
      - name: ReadyListener
        doc: Consumer-implemented observer of ready items
        methods:
          - name: on_ready
            doc: Fires when an item is ready
            params:
              - { name: code, type: i32 }
              - { name: msg, type: string }
          - name: on_item
            doc: Receives the item itself and says whether to keep listening
            params:
              - { name: item, type: Item }
              - { name: gadget, type: Gadget }
            return: bool
    errors:
      name: KitchenErrors
      codes:
        - { name: NotFound, code: 1, message: "Item not found" }
        - { name: InvalidInput, code: 2, message: "Invalid input" }
    interfaces:
      - name: Gadget
        doc: A pocket-sized interface exercising the object surface
        constructors:
          - name: new
            doc: Create a gadget with the given id
            params:
              - { name: id, type: i64 }
        methods:
          - name: describe
            doc: Render the gadget as a human-readable string
            params: []
            return: string
          - name: poke
            doc: Poke the gadget a number of times, failing on a negative count
            params:
              - { name: times, type: i32 }
            return: i32
            throws: true
        statics:
          - name: version
            doc: The gadget subsystem version string
            params: []
            return: string
    functions:
      - name: bool_id
        doc: Identity for bool
        params:
          - { name: x, type: bool }
        return: bool
      - name: i32_id
        params:
          - { name: x, type: i32 }
        return: i32
      - name: u32_id
        params:
          - { name: x, type: u32 }
        return: u32
      - name: i64_id
        params:
          - { name: x, type: i64 }
        return: i64
      - name: f64_id
        params:
          - { name: x, type: f64 }
        return: f64
      - name: echo_string
        params:
          - { name: s, type: string }
        return: string
      - name: echo_bytes
        params:
          - { name: b, type: bytes }
        return: bytes
      - name: subscribe
        doc: Register a listener, returning how many are attached
        params:
          - { name: listener, type: ReadyListener }
        return: i32
      - name: maybe_gadget
        doc: Optional object in both directions
        params:
          - { name: fallback, type: "Gadget?" }
        return: "Gadget?"
      - name: gadgets
        doc: A list of objects
        params: []
        return: "[Gadget]"
      - name: stream_gadgets
        doc: An iterator over objects
        params: []
        return: "iter<Gadget>"
      - name: maybe_item
        doc: Optional struct return
        params:
          - { name: id, type: i64 }
        return: "Item?"
        throws: true
      - name: list_items
        doc: List of structs
        params: []
        return: "[Item]"
      - name: get_attrs
        doc: Map return type
        params: []
        return: "{string:i32}"
      - name: stream_items
        doc: Iterator return type
        params: []
        return: "iter<Item>"
      - name: cross_module_token
        doc: Returns the shared Token type from another module
        params: []
        return: Token
      - name: do_async
        doc: Async operation
        params:
          - { name: input, type: string }
        return: string
        async: true
      - name: do_cancellable
        doc: Cancellable async operation
        params:
          - { name: input, type: string }
        return: string
        async: true
        cancellable: true
      - name: legacy_op
        doc: Legacy operation kept for compatibility
        params: []
        return: i32
        deprecated: "Use new_op instead"
      - name: new_op
        doc: Replacement for legacy_op
        params: []
        return: i32
    modules:
      - name: nested
        functions:
          - name: hello
            doc: Trivial nested-module function
            params: []
            return: string
