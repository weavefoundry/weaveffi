version: "0.13.0"
records:
- name: Item
  doc: Something for sale.
  fields:
  - name: name
    type: string
    doc: The item's name.
  - name: price
    type: u64
    doc: What it costs.
  - name: size
    type: Size
    doc: How big it is.
enums:
- name: Size
  doc: How big an item is.
  variants:
  - name: Small
    value: 0
    doc: Small.
  - name: Large
    value: 1
    doc: Large.
errors:
- name: ShopError
  doc: The shop's error domain.
  codes:
  - name: SoldOut
    code: 1
    message: "{item} is sold out"
    doc: sold out
    fields:
    - name: item
      type: string
      doc: The item that ran out.
interfaces:
- name: Cart
  doc: A shopping cart.
  constructors:
  - name: new
    doc: An empty cart.
  methods:
  - name: add
    params:
    - name: item
      type: Item
    - name: watcher
      type: Watcher?
    doc: Add `item`, telling `watcher`.
  - name: total
    return: u64
    doc: The sum of every item's price.
callbacks:
- name: Watcher
  doc: Told about every item added to a cart.
  methods:
  - name: added
    params:
    - name: item
      type: Item
    doc: "`item` was added."
    throws: any
functions:
- name: price_of
  params:
  - name: item
    type: Item
  return: u64
  doc: What `item` costs.
- name: buy
  params:
  - name: name
    type: string
  return: Item
  doc: |-
    Buy one `name`. Fails with `ShopError::SoldOut` for anything but
    `"tea"`.
  throws: ShopError
- name: list_price
  return: u64
  doc: The list price of everything.
- name: count
  params:
  - name: cart
    type: Cart?
  return: u32
  doc: How many items `cart` holds, if there is one.
- name: line
  params:
  - name: item
    type: Item
  return: string
  doc: One line describing `item`.
