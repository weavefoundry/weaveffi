# A small Rust producer for the CLI's library-mode tests: `weaveffi extract`
# and `weaveffi generate` read its API from the library it builds. It
# declares no `crate-type`: WeaveFFI builds the `cdylib` itself.
[package]
name = "producer-fixture"
version = "0.3.0"
edition.workspace = true
publish = false

[features]
# Compiles in the declarations marked `#[cfg(feature = "extra")]`.
extra = []

[dependencies]
weaveffi = { path = "../../../../weaveffi" }

[lints]
workspace = true
