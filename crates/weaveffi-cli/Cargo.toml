[package]
name = "weaveffi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line tool for generating multi-language FFI bindings from API definitions"
keywords = ["ffi", "codegen", "bindings", "cli", "code-generation"]
categories = ["development-tools::ffi", "command-line-utilities"]
exclude = [
    "tests/fixtures/**",
    "tests/snapshots/**",
]

[[bin]]
name = "weaveffi"
path = "src/main.rs"
# The binary shares its name with the `weaveffi` library crate; documenting
# both would collide in `target/doc`.
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/weaveffi-{ target }{ archive-suffix }"
bin-dir = "weaveffi-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
miette = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
weaveffi-model = { workspace = true, features = ["idl"] }
weaveffi-gen = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_yaml = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
insta = { workspace = true }


[lints]
workspace = true
