name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Format, clippy, and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::all -D rustdoc::missing_crate_level_docs
        run: cargo doc --workspace --no-deps
      - name: weaveffi-model builds without the IDL formats (as the proc macro uses it)
        run: cargo check -p weaveffi-model --no-default-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      # One pass runs every test and fails on any snapshot drift.
      - run: cargo insta test --workspace --check
      - name: Benchmarks compile
        if: runner.os == 'Linux'
        run: cargo bench --workspace --no-run

  generated-drift:
    name: Samples, schema, and wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p weaveffi-cli
      # `weaveffi diff --check` is the CI gate we recommend to users, so it
      # must hold for our own samples: a fresh tree diffs clean, and a tree
      # with a stale file is reported instead of silently passing.
      - name: weaveffi diff --check on every sample
        run: |
          set -euo pipefail
          BIN=target/debug/weaveffi
          for sample in calculator contacts events kvstore async-demo codec; do
            "$BIN" generate "samples/$sample/src/lib.rs" -o "diffcheck/$sample" --quiet
            "$BIN" diff "samples/$sample/src/lib.rs" -o "diffcheck/$sample" --check --quiet
          done
          echo "stale" >> diffcheck/calculator/c/calculator.h
          if "$BIN" diff samples/calculator/src/lib.rs -o diffcheck/calculator --check --quiet; then
            echo "diff --check did not detect a modified file" >&2
            exit 1
          fi
      - name: weaveffi.schema.json is up to date
        run: |
          target/debug/weaveffi schema > weaveffi.schema.json.regenerated
          diff -u weaveffi.schema.json weaveffi.schema.json.regenerated
      - name: Every sample builds for wasm32
        run: cargo build --target wasm32-unknown-unknown -p calculator -p contacts -p events -p kvstore -p async-demo -p codec

  fixtures:
    # Snapshot tests pin the generated text; this compiles or type-checks it
    # with each language's own toolchain, for every fixture, so invalid code
    # in shapes no sample exercises still fails CI.
    name: Fixture compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: c, os: ubuntu-latest }
          - { target: cpp, os: ubuntu-latest }
          - { target: swift, os: macos-latest }
          - { target: kotlin, os: ubuntu-latest }
          - { target: node, os: ubuntu-latest }
          - { target: wasm, os: ubuntu-latest }
          - { target: python, os: ubuntu-latest }
          - { target: dotnet, os: ubuntu-latest }
          - { target: dart, os: ubuntu-latest }
          - { target: go, os: ubuntu-latest }
          - { target: ruby, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchains
        with:
          lang: ${{ matrix.target }}
      - run: bash scripts/check-fixtures.sh ${{ matrix.target }}

  conformance:
    # Behavioral gate: every consumer binds through the *generated* bindings
    # and asserts concrete results, including leak counters returning to zero.
    name: Conformance (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, python, ruby, dart, go, swift, dotnet, node, kotlin, wasm]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchains
        with:
          lang: ${{ matrix.lang }}
      - run: bash conformance/run.sh
        env:
          ONLY: ${{ matrix.lang }}

  android:
    # The Kotlin target's JNI shim must compile and link against a real
    # producer built for Android.
    name: Android (NDK link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Build the kvstore producer for aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build -p kvstore --target aarch64-linux-android --release
      - name: Generate and link the JNI shim against it
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          cargo run -q -p weaveffi-cli -- generate samples/kvstore/src/lib.rs -o generated --target c,kotlin
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          shim=$(ls generated/kotlin/src/main/cpp/*.c | head -1)
          "$CLANG" -shared -fPIC -Werror -I generated/kotlin/src/main/cpp -I generated/c "$shim" \
            -L target/aarch64-linux-android/release -lkvstore -o libkvstore_jni.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d libkvstore_jni.so | grep 'libkvstore.so'
