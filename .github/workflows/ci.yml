name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Format, clippy, and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::all -D rustdoc::missing_crate_level_docs
        run: cargo doc --workspace --no-deps
      - name: weaveffi-model builds without the IDL formats (as the proc macro uses it)
        run: cargo check -p weaveffi-model --no-default-features

  msrv:
    # `rust-version` in Cargo.toml is a promise to producers, whose builds
    # compile the runtime and the macros.
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p weaveffi -p weaveffi-macros -p weaveffi-model -p weaveffi-cli
      - run: cargo test --locked -p calculator -p kvstore -p codec

  miri:
    # The runtime's unsafe core (runs, objects, callbacks, iterators,
    # cancellation) under Miri's checks for undefined behavior.
    name: Miri (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p weaveffi --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      # One pass runs every test and fails on any snapshot drift.
      - run: cargo insta test --workspace --check
      # Bench smoke run: every benchmark compiles, and criterion's `--test`
      # mode executes each body once, with no warmup or sampling, which
      # catches panics and stale inputs. bench.yml collects the numbers.
      - name: Benchmarks build and run once
        if: runner.os == 'Linux'
        run: |
          cargo bench --workspace --no-run
          cargo bench -p weaveffi-cli --bench codegen_bench -- --test

  generated-drift:
    name: Samples, schema, and wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p weaveffi-cli
      # `weaveffi generate --check` is the CI gate we recommend to users, so
      # it must hold for our own samples: a fresh tree checks clean, and a
      # tree with a stale file is reported instead of silently passing.
      - name: weaveffi generate --check on every sample
        run: |
          set -euo pipefail
          BIN=target/debug/weaveffi
          for sample in calculator codec kvstore; do
            "$BIN" generate "samples/$sample" -o "diffcheck/$sample" --quiet
            "$BIN" generate "samples/$sample" -o "diffcheck/$sample" --check --quiet
          done
          echo "stale" >> diffcheck/calculator/c/calculator.h
          if "$BIN" generate samples/calculator -o diffcheck/calculator --check --quiet; then
            echo "generate --check did not detect a modified file" >&2
            exit 1
          fi
      - name: weaveffi.schema.json is up to date
        run: |
          target/debug/weaveffi schema > weaveffi.schema.json.regenerated
          diff -u weaveffi.schema.json weaveffi.schema.json.regenerated
      - name: Every sample builds for wasm32
        run: cargo build --target wasm32-unknown-unknown -p calculator -p codec -p kvstore
      # A `.wasm` module carries its metadata in a custom section rather
      # than in symbols; it must describe the same API as the native build.
      - name: The wasm32 metadata matches the native metadata
        run: |
          set -euo pipefail
          for sample in calculator codec kvstore; do
            target/debug/weaveffi extract -q "samples/$sample" > "native-$sample.yml"
            target/debug/weaveffi extract -q "samples/$sample" \
              --library "target/wasm32-unknown-unknown/debug/$sample.wasm" > "wasm-$sample.yml"
            diff -u "native-$sample.yml" "wasm-$sample.yml"
          done

  fixtures:
    # Snapshot tests pin the generated text; this compiles or type-checks it
    # with each language's own toolchain, for every fixture, so invalid code
    # in shapes no sample exercises still fails CI. GitHub sets CI=true, so a
    # missing tool fails the job instead of skipping a check.
    name: Fixture compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: c, os: ubuntu-latest }
          - { target: cpp, os: ubuntu-latest }
          - { target: swift, os: macos-latest }
          - { target: kotlin, os: ubuntu-latest }
          - { target: node, os: ubuntu-latest }
          - { target: wasm, os: ubuntu-latest }
          - { target: python, os: ubuntu-latest }
          - { target: dotnet, os: ubuntu-latest }
          - { target: dart, os: ubuntu-latest }
          - { target: go, os: ubuntu-latest }
          - { target: ruby, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchains
        with:
          lang: ${{ matrix.target }}
      - run: cargo xtask fixtures ${{ matrix.target }}

  conformance:
    # Behavioral gate: every consumer binds through the *generated* bindings
    # and asserts concrete results, including leak counters returning to zero.
    name: Conformance (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, python, ruby, dart, go, swift, dotnet, node, kotlin, wasm]
        os: [ubuntu-latest, macos-latest]
        # The targets whose consumers load the library at run time, on
        # Windows (where the lane scripts run under Git Bash).
        include:
          - { lang: python, os: windows-latest }
          - { lang: dotnet, os: windows-latest }
          - { lang: node, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchains
        with:
          lang: ${{ matrix.lang }}
      - run: cargo xtask conformance --only ${{ matrix.lang }}

  skew:
    # Bindings against a library of a different version: older bindings
    # load a newer library, a changed declaration is reported by its path,
    # and a missing one fails to link.
    name: Version skew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask skew

  android:
    # `weaveffi build` cross-compiles a producer for Android with the NDK,
    # with the soname the Kotlin package's jniLibs need (JNA loads it).
    name: Android (NDK build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: weaveffi build cross-compiles the producer
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          cargo run -q -p weaveffi-cli -- build samples/kvstore --platforms android-arm64 --strict
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -d target/weaveffi/android-arm64/libkvstore.so | grep 'SONAME.*libkvstore.so'
          "$readelf" --dyn-syms target/weaveffi/android-arm64/libkvstore.so | grep -q 'kvstore_contract_'

  package-smoke:
    # `weaveffi package` must produce artifacts each ecosystem's own tool
    # installs with no compiler: the wheel into a venv, the npm tarballs into
    # a throwaway project (koffi loads the bundled library), and on macOS the
    # SwiftPM package over its XCFramework. GitHub sets CI=true, so a missing
    # tool fails the job instead of skipping a target.
    name: Package install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchains
        with:
          lang: python
      - uses: ./.github/actions/toolchains
        with:
          lang: node
      - run: bash scripts/package-smoke.sh
