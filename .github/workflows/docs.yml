name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook + mdbook-linkcheck2
        # Keep this in sync with the docs linkcheck job in quality.yml.
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-linkcheck2

      - name: Build mdBook
        run: mdbook build docs

      - name: Build Rust API docs
        run: cargo doc --workspace --all-features --no-deps

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r docs/book/html/* site/
          mkdir -p site/api/rust
          cp -r target/doc/* site/api/rust/
          cp weaveffi.schema.json site/
          touch site/.nojekyll
          printf "weaveffi.com" > site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
