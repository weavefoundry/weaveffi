name: Bench

# Weekly (and on demand) sampled benchmark run. The uploaded artifact is the
# historical record of the numbers. Pull requests get a cheaper smoke run in
# ci.yml, which executes every benchmark body once.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: cargo bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Run cargo bench
        # The criterion harness accepts `--noplot`; `cargo bench --workspace`
        # also fans out to the default `libtest` harness in every other
        # crate, which rejects `--noplot`, so we invoke the criterion bench
        # explicitly. `--noplot` skips the gnuplot/plotters HTML
        # reports so the artifact stays small (a few KB of text instead
        # of MBs of SVG plots).
        run: |
          set -euo pipefail
          cargo bench -p weaveffi-cli --bench codegen_bench -- --noplot 2>&1 | tee bench.txt

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.txt
          if-no-files-found: error
          retention-days: 90
