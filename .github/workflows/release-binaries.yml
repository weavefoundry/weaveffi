name: Release binaries

# Builds the `weaveffi` CLI for every supported host and attaches the
# archives to the GitHub release (the same names `cargo binstall weaveffi-cli`
# resolves through the crate's `[package.metadata.binstall]`).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to (for example v0.24.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `native` marks a binary the runner can execute, so the job runs its
        # `--version` before uploading. x86_64-apple-darwin is cross-compiled
        # on the arm64 macOS runner (GitHub retired the Intel images) and
        # isn't run there.
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, native: true }
          - { target: x86_64-apple-darwin, os: macos-latest, native: false }
          - { target: aarch64-apple-darwin, os: macos-latest, native: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, native: true }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p weaveffi-cli --release --locked --target ${{ matrix.target }}
      - name: Smoke-test the binary
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          version=$("target/${{ matrix.target }}/release/weaveffi" --version)
          echo "$version"
          case "$version" in
            *" ${TAG#v}"*) ;;
            *) echo "expected version ${TAG#v} from $TAG" >&2; exit 1 ;;
          esac
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="weaveffi-${{ matrix.target }}"
          mkdir "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/weaveffi.exe" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            7z a "$name.zip" "$name" > /dev/null
            gh release upload "$TAG" "$name.zip" --clobber
          else
            cp "target/${{ matrix.target }}/release/weaveffi" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            tar czf "$name.tar.gz" "$name"
            gh release upload "$TAG" "$name.tar.gz" --clobber
          fi
