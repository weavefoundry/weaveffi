name: Fuzz

# Daily (and on demand), each target runs for 60 seconds from a corpus seeded
# with its committed seeds plus inputs derived from the snapshot fixtures.
# Extend a run by bumping `-max_total_time` below.
on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC daily.
    - cron: '0 8 * * *'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parse_yaml
          - fuzz_parse_json
          - fuzz_parse_toml
          - fuzz_parse_type_ref
          - fuzz_validate
          - fuzz_value_buffer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed the corpus
        run: |
          python -m pip install pyyaml tomli-w
          python crates/weaveffi-fuzz/seed_corpus.py ${{ matrix.target }} \
            crates/weaveffi-fuzz/corpus/${{ matrix.target }}

      - name: Run ${{ matrix.target }} for 60s
        # Any crash is written to artifacts/ and fails the job.
        run: |
          cargo +nightly fuzz run \
            --fuzz-dir crates/weaveffi-fuzz \
            --features fuzzing \
            ${{ matrix.target }} \
            crates/weaveffi-fuzz/corpus/${{ matrix.target }} \
            -- -max_total_time=60 -seed=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/weaveffi-fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
